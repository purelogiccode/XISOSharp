<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>XISOSharp — Documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="XISOSharp — pure C# extract-xiso v2.7.1 port (XISO/XDVDFS) with Redump archival & xdvdfs parity"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"/>
    <style>
    /* left sidebar fixed, highlight active */
    .sidebar { width: 280px; }
    .sidebar-nav li.active > a { font-weight: 700; border-left: 3px solid #42b983; padding-left: 8px; }
    /* narrow screens: keep toggle */
    @media (max-width: 768px) { .sidebar { width: 260px; } }
  </style>
</head>
<body>
<div id="app">Loading XISOSharp docs…</div>
<script>
    window.$docsify = {
      name: 'XISOSharp',
      repo: 'purelogiccode/XISOSharp',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: 'Search docs…',
        noData: 'No results.'
      },
      alias: {
        '/wiki/(.*)': '/$1'
      },
      homepage: 'README.md',
      notFoundPage: false,
      themeColor: '#42b983'
    };
  </script>
<!-- Docsify core -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<!-- Plugins: search + copy-code + pagination (optional) -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
