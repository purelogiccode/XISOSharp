name: CodeQL

# Static security analysis (GitHub code scanning). Results land in
# Security > Code scanning and on pull requests that touch analyzed code.
# C# needs a real compilation, so the workflow builds the solution between
# `init` and `analyze` (build-mode: manual).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly, Monday 04:27 UTC.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        # -m:1: the GUI stages the CLI out-of-band; a parallel build can race it.
        run: dotnet build CSharp_XISOSharp.sln -c Release -m:1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
