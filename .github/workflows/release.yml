name: Release

# Builds the six framework-dependent app bundles from AGENTS.md's bundle
# recipe, smoke-tests the native ones, and attaches them to the GitHub
# release for the pushed tag. NuGet publishing stays in ci.yml.
#
# workflow_dispatch exists to rehearse the pipeline without tagging:
# set dry_run=true to build + smoke-test the bundles only.

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.6.0); the tag must exist for a real release.'
        required: true
        type: string
      dry_run:
        description: 'Build and smoke-test the bundles without creating a GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            dry_run="${{ inputs.dry_run }}"
          else
            version="${GITHUB_REF_NAME}"
            dry_run="false"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::Could not resolve a release version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

  bundle:
    name: bundle (${{ matrix.zip_rid }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            zip_rid: win-x64
          - rid: win-arm64
            zip_rid: win-arm64
          - rid: linux-x64
            zip_rid: linux-x64
          - rid: linux-arm64
            zip_rid: linux-arm64
          - rid: osx-x64
            zip_rid: MacOsX-x64
          - rid: osx-arm64
            zip_rid: MacOsX-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore CLI
        # The GUI's BuildCliForStaging target builds XISOSharp.Cli out-of-band
        # (deliberately not a ProjectReference), so its assets file must exist
        # before the GUI publish on a clean checkout.
        run: dotnet restore XISOSharp.Cli/XISOSharp.Cli.csproj

      - name: Publish GUI
        run: >-
          dotnet publish XISOSharp.Gui/XISOSharp.Gui.csproj
          -c Release -r ${{ matrix.rid }} --no-self-contained
          -p:MinVerVersionOverride=${{ needs.resolve.outputs.version }}
          -o "$RUNNER_TEMP/stage"

      - name: Publish CLI
        run: >-
          dotnet publish XISOSharp.Cli/XISOSharp.Cli.csproj
          -c Release -f net10.0 -r ${{ matrix.rid }} --no-self-contained
          -p:PublishTrimmed=false
          -p:MinVerVersionOverride=${{ needs.resolve.outputs.version }}
          -o "$RUNNER_TEMP/stage"

      - name: Assemble bundle
        # AGENTS.md contract: exactly the GUI app, XISOSharp(.exe), README.md,
        # LICENSE and WhatsNew.md — no *.pdb / *.xml (the native Skia/HarfBuzz
        # pdbs alone are ~100 MB).
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          cli="XISOSharp"
          gui="XISOSharp.Gui"
          case "${{ matrix.rid }}" in
            win-*) cli="XISOSharp.exe"; gui="XISOSharp.Gui.exe" ;;
          esac

          find "$stage" -type f \( -name '*.pdb' -o -name '*.xml' \) -delete
          cp README.md LICENSE WhatsNew.md "$stage"/

          for expected in "$cli" "$gui" README.md LICENSE WhatsNew.md; do
            if [ ! -f "$stage/$expected" ]; then
              echo "::error::Bundle is missing $expected"
              ls -la "$stage"
              exit 1
            fi
          done

          count=$(find "$stage" -type f | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::Bundle has $count files; expected exactly 5."
            find "$stage" -type f
            exit 1
          fi

          zip_path="$GITHUB_WORKSPACE/release_${{ needs.resolve.outputs.version }}_${{ matrix.zip_rid }}.zip"
          cd "$stage"
          zip -q -r "$zip_path" "$cli" "$gui" README.md LICENSE WhatsNew.md
          echo "Created $zip_path"
          unzip -l "$zip_path"

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.zip_rid }}
          path: release_*.zip
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: sign windows bundles
    needs: [resolve, bundle]
    # DST-02: enable with the ENABLE_WINDOWS_SIGNING repository variable plus
    # WINDOWS_SIGNING_CERT (base64 PFX) and WINDOWS_SIGNING_PASSWORD secrets.
    # When disabled, the unsigned bundle artifacts flow straight to `release`.
    if: vars.ENABLE_WINDOWS_SIGNING == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - name: Download Windows bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-win-*
          path: dist
          merge-multiple: true

      - name: Import signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERT) { throw 'WINDOWS_SIGNING_CERT is empty.' }
          if (-not $env:WINDOWS_SIGNING_PASSWORD) { throw 'WINDOWS_SIGNING_PASSWORD is empty.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'xisosharp-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK.' }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign and verify executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Join-Path $env:RUNNER_TEMP 'xiso-sign-stage'
          $signedRoot = Join-Path $env:GITHUB_WORKSPACE 'signed'
          New-Item -ItemType Directory -Force -Path $stageRoot, $signedRoot | Out-Null

          foreach ($zip in Get-ChildItem dist -Filter 'release_*_win-*.zip') {
            $rid = if ($zip.Name -match 'win-arm64') { 'win-arm64' } else { 'win-x64' }
            $stage = Join-Path $stageRoot $rid
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $stage

            foreach ($exe in @('XISOSharp.exe', 'XISOSharp.Gui.exe')) {
              $path = Join-Path $stage $exe
              & $env:SIGNTOOL sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /f $env:PFX_PATH /p $env:WINDOWS_SIGNING_PASSWORD $path
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $exe ($LASTEXITCODE)." }
              & $env:SIGNTOOL verify /pa /v $path
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $exe ($LASTEXITCODE)." }
            }

            $files = @(Get-ChildItem $stage -File)
            if ($files.Count -ne 5) {
              throw "Signed bundle $($zip.Name) has $($files.Count) files; expected exactly 5."
            }
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $signedRoot $zip.Name) -Force
          }

      - name: Upload signed x64 bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-win-x64
          path: signed/release_*_win-x64.zip
          if-no-files-found: error

      - name: Upload signed arm64 bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-win-arm64
          path: signed/release_*_win-arm64.zip
          if-no-files-found: error

  sign-macos:
    name: sign macos bundles
    needs: [resolve, bundle]
    # DST-02: enable with the ENABLE_MACOS_SIGNING repository variable plus a
    # Developer ID Application certificate. Notarization additionally needs the
    # MACOS_NOTARY_* secrets; without them the bundles are signed but not
    # notarized.
    if: vars.ENABLE_MACOS_SIGNING == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
      MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - name: Download macOS bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-MacOsX-*
          path: dist
          merge-multiple: true

      - name: Import signing certificate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGNING_CERT:-}" ]; then echo "::error::MACOS_SIGNING_CERT is empty."; exit 1; fi
          if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then echo "::error::MACOS_SIGNING_IDENTITY is empty."; exit 1; fi
          cert="$RUNNER_TEMP/signing.p12"
          printf '%s' "$MACOS_SIGNING_CERT" | base64 --decode > "$cert"
          keychain="$RUNNER_TEMP/xisosharp-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

      - name: Codesign, notarize and rezip
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$RUNNER_TEMP/xiso-sign-stage"
          signed_root="$GITHUB_WORKSPACE/signed"
          rm -rf "$stage_root" "$signed_root"
          mkdir -p "$stage_root" "$signed_root"

          for zip in dist/release_*_MacOsX-*.zip; do
            name="$(basename "$zip")"
            rid="${name#release_*_}"
            rid="${rid%.zip}"
            stage="$stage_root/$rid"
            mkdir -p "$stage"
            unzip -q "$zip" -d "$stage"

            # Sign every Mach-O executable/dylib; managed DLLs are not Mach-O
            # and are covered by the apphost signature.
            while IFS= read -r -d '' file; do
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$file"
            done < <(find "$stage" -type f \( -perm -111 -o -name '*.dylib' \) -print0)
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
              "$stage/XISOSharp" "$stage/XISOSharp.Gui"
            codesign --verify --strict --verbose=2 "$stage/XISOSharp" "$stage/XISOSharp.Gui"

            if [ -n "${MACOS_NOTARY_APPLE_ID:-}" ] && [ -n "${MACOS_NOTARY_TEAM_ID:-}" ] && [ -n "${MACOS_NOTARY_PASSWORD:-}" ]; then
              notarize_zip="$RUNNER_TEMP/$name.notarize.zip"
              (cd "$stage" && ditto -c -k . "$notarize_zip")
              xcrun notarytool submit "$notarize_zip" \
                --apple-id "$MACOS_NOTARY_APPLE_ID" \
                --team-id "$MACOS_NOTARY_TEAM_ID" \
                --password "$MACOS_NOTARY_PASSWORD" \
                --wait
              # Bare executables in a zip cannot be stapled; Gatekeeper checks
              # the notarization ticket online. Record the assessment result.
              if ! spctl --assess --type execute --verbose=2 "$stage/XISOSharp"; then
                echo "::warning::spctl assessment failed; confirm notarization in the notary log."
              fi
            else
              echo "::warning::MACOS_NOTARY_* secrets are not set; the bundle is signed but not notarized."
            fi

            (cd "$stage" && zip -q -r "$signed_root/$name" \
              XISOSharp XISOSharp.Gui README.md LICENSE WhatsNew.md)
          done

      - name: Upload signed x64 bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-MacOsX-x64
          path: signed/release_*_MacOsX-x64.zip
          if-no-files-found: error

      - name: Upload signed arm64 bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-MacOsX-arm64
          path: signed/release_*_MacOsX-arm64.zip
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.zip_rid }})
    needs: [resolve, bundle, sign-windows, sign-macos]
    # Run after optional signing; a skipped sign job means signing is disabled.
    if: >-
      always() && needs.bundle.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') &&
      (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zip_rid: win-x64
            os: windows-latest
            artifact: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' && 'signed-win-x64' || 'release-win-x64' }}
          - zip_rid: linux-x64
            os: ubuntu-latest
            artifact: release-linux-x64
          - zip_rid: MacOsX-arm64
            os: macos-latest
            artifact: ${{ vars.ENABLE_MACOS_SIGNING == 'true' && 'signed-MacOsX-arm64' || 'release-MacOsX-arm64' }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Smoke-test (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          unzip -q release_*.zip -d bundle
          cd bundle
          chmod +x XISOSharp XISOSharp.Gui

          ./XISOSharp -v | tee cli.txt
          grep -Eq '^XISOSharp v[0-9]+\.[0-9]+\.[0-9]+' cli.txt

          ./XISOSharp.Gui --probe-cli ./XISOSharp | tee probe.txt
          # The label comes from file metadata; single-file Linux/macOS builds
          # fall back to the documented "XISOSharp CLI" form.
          grep -Eq 'XISOSharp ([0-9]+\.[0-9]+\.[0-9]+|CLI)' probe.txt

          ./XISOSharp.Gui --self-test ./XISOSharp | tee selftest.txt
          grep -q 'SELF-TEST: all passed' selftest.txt

      - name: Smoke-test (windows)
        # WinExe: PowerShell does not wait for `&`, so Start-Process -Wait
        # captures the exit code and redirected output.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path (Get-ChildItem dist/*.zip).FullName -DestinationPath dist/bundle
          Set-Location dist/bundle

          $bannerLines = & ./XISOSharp.exe -v
          if ($LASTEXITCODE -ne 0) { throw "CLI -v exited $LASTEXITCODE" }
          $banner = $bannerLines -join "`n"
          if ($banner -notmatch '^XISOSharp v\d+\.\d+\.\d+') { throw "Unexpected CLI banner: $banner" }
          Write-Host $banner

          function Invoke-Gui([string[]]$Arguments) {
            $stdout = Join-Path $env:RUNNER_TEMP ("gui-out-" + [guid]::NewGuid().ToString('N') + ".txt")
            $stderr = Join-Path $env:RUNNER_TEMP ("gui-err-" + [guid]::NewGuid().ToString('N') + ".txt")
            $process = Start-Process -FilePath './XISOSharp.Gui.exe' -ArgumentList $Arguments -Wait -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text = (Get-Content -LiteralPath $stdout -Raw) + (Get-Content -LiteralPath $stderr -Raw)
            if ($process.ExitCode -ne 0) {
              Write-Host $text
              throw "GUI $($Arguments -join ' ') exited $($process.ExitCode)"
            }
            return $text
          }

          $probe = Invoke-Gui @('--probe-cli', './XISOSharp.exe')
          Write-Host $probe
          # The label comes from file metadata; single-file Linux/macOS builds
          # fall back to the documented "XISOSharp CLI" form.
          if ($probe -notmatch 'XISOSharp (\d+\.\d+\.\d+|CLI)') { throw 'GUI --probe-cli did not print the product label.' }

          $selfTest = Invoke-Gui @('--self-test', './XISOSharp.exe')
          Write-Host $selfTest
          if ($selfTest -notmatch 'SELF-TEST: all passed') { throw 'GUI --self-test did not pass.' }

  release:
    name: create GitHub release
    needs: [resolve, smoke]
    # `always()` is required: `smoke` is forced to run after the optional
    # signing jobs are skipped, and without it this job inherits the skipped
    # state of those transitive dependencies. Tag pushes always publish; a
    # workflow_dispatch rehearsal only skips creation when dry_run is true.
    if: >-
      always() && needs.resolve.result == 'success' && needs.smoke.result == 'success' &&
      (github.event_name == 'push' || needs.resolve.outputs.dry_run != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download unsigned bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download signed Windows bundles
        if: vars.ENABLE_WINDOWS_SIGNING == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: signed-win-*
          path: signed-win
          merge-multiple: true

      - name: Download signed macOS bundles
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: signed-MacOsX-*
          path: signed-macos
          merge-multiple: true

      - name: Prefer signed bundles
        run: |
          set -euo pipefail
          if [ "${{ vars.ENABLE_WINDOWS_SIGNING }}" = "true" ]; then
            rm -f dist/release_*_win-*.zip
            cp signed-win/*.zip dist/
          fi
          if [ "${{ vars.ENABLE_MACOS_SIGNING }}" = "true" ]; then
            rm -f dist/release_*_MacOsX-*.zip
            cp signed-macos/*.zip dist/
          fi
          count=$(find dist -maxdepth 1 -name 'release_*.zip' | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected six release bundles, found $count."
            ls -la dist
            exit 1
          fi
          ls -la dist

      - name: Generate SBOM
        # SPDX 2.2 SBOM over the release bundle contents, published alongside
        # the zips for supply-chain verification.
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13
          export PATH="$PATH:$HOME/.dotnet/tools"
          sbom-tool generate -b dist -bc . -pn XISOSharp -pv "$version" \
            -ps purelogiccode -nsb "https://github.com/$GITHUB_REPOSITORY"
          cp dist/_manifest/spdx_2.2/manifest.spdx.json "dist/XISOSharp-$version.spdx.json"
          ls -la dist

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          awk -v v="$version" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' docs/release-notes.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $version" > release-notes.md
          fi
          echo '--- release notes ---'
          cat release-notes.md

      - name: Create or update release
        # Tag pushes always publish; a workflow_dispatch rehearsal skips this
        # step when dry_run is true. Check both the string and boolean forms
        # because dispatch input typing differs between contexts.
        if: ${{ github.event_name == 'push' || inputs.dry_run == 'false' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          ls -la dist
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run: refresh the same-named assets, never delete anything else.
            gh release upload "$version" dist/*.zip dist/*.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$version" --verify-tag --title "$version" --draft=false \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY" dist/*.zip dist/*.spdx.json
          fi
          # A release created while the tag was being moved can land as a draft;
          # make the published state explicit on every run.
          gh release edit "$version" --draft=false --repo "$GITHUB_REPOSITORY"
          gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
