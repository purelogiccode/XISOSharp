name: CI

on:
  push:
    branches: [master, main]
    # Version tags pack + publish the library to NuGet (`1.0.2` or `v1.0.2`).
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Least privilege by default. The tag-only publish job pushes to nuget.org via
# the `nuget` environment secret and needs no write access to this repository.
permissions:
  contents: read

# Cancel superseded PR runs; never cancel a tag run that may be mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Fails the coverage summary step when coverage drops below these floors.
  MIN_LINE_COVERAGE: '70'
  MIN_BRANCH_COVERAGE: '60'

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Report every OS even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # MinVer derives Version/InformationalVersion from git tags; a
          # shallow clone reports the wrong version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Full solution. The WPF Tester compiles on Linux/macOS through
        # EnableWindowsTargeting=true (it still only runs on Windows).
        # -m:1 serializes project builds: XISOSharp.Gui stages the CLI via an
        # out-of-band MSBuild call (BuildCliForStaging), and a parallel
        # solution build can race writes to the CLI output.
        run: dotnet build --no-restore --configuration Release -m:1

      - name: Verify formatting
        # `.editorconfig` normalizes line endings via Git, so run the whitespace
        # gate on Windows where the working tree is CRLF (the formatter's host
        # default). Linux/macOS jobs still build and test the same sources.
        if: matrix.os == 'windows-latest'
        run: dotnet format whitespace CSharp_XISOSharp.sln --verify-no-changes --no-restore

      - name: Test
        # Runs on every OS: the suite is sequential and restores the process
        # working directory, so Linux/macOS now exercise the same code paths
        # (the old Windows-only gate hid CWD/clone regressions).
        # --blame-hang-dump-type none: hang dumps are not uploaded (too large),
        # so skip collecting them and abort faster on a hung test host.
        run: >-
          dotnet test XISOSharp.Tests/XISOSharp.Tests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          --blame-hang-timeout 15m
          --blame-hang-dump-type none

      - name: Coverage summary
        # Reports merged line/branch coverage in the job summary and enforces
        # the MIN_LINE_COVERAGE floor. Informational when no report exists.
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Warning 'No coverage report found.'
            exit 0
          }

          $linesValid = 0; $linesCovered = 0; $branchesValid = 0; $branchesCovered = 0
          foreach ($file in $files) {
            [xml]$report = Get-Content -LiteralPath $file.FullName
            $linesValid += [int]$report.coverage.'lines-valid'
            $linesCovered += [int]$report.coverage.'lines-covered'
            $branchesValid += [int]$report.coverage.'branches-valid'
            $branchesCovered += [int]$report.coverage.'branches-covered'
          }

          if ($linesValid -eq 0) {
            Write-Warning 'Coverage report contains no lines.'
            exit 0
          }

          $lineRate = 100.0 * $linesCovered / $linesValid
          $branchRate = if ($branchesValid -gt 0) { 100.0 * $branchesCovered / $branchesValid } else { 100.0 }
          $floor = [double]$env:MIN_LINE_COVERAGE
          $branchFloor = [double]$env:MIN_BRANCH_COVERAGE

          @(
            '### Test coverage',
            '',
            '| Metric | Covered | Total | Rate |',
            '| --- | ---: | ---: | ---: |',
            ('| Lines | {0:N0} | {1:N0} | {2:N1}% |' -f $linesCovered, $linesValid, $lineRate),
            ('| Branches | {0:N0} | {1:N0} | {2:N1}% |' -f $branchesCovered, $branchesValid, $branchRate),
            '',
            ('Line-coverage floor: {0:N0}%. Branch-coverage floor: {1:N0}%.' -f $floor, $branchFloor)
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($lineRate -lt $floor) {
            Write-Error ('Line coverage {0:N1}% is below the {1:N0}% floor.' -f $lineRate, $floor)
            exit 1
          }

          if ($branchRate -lt $branchFloor) {
            Write-Error ('Branch coverage {0:N1}% is below the {1:N0}% floor.' -f $branchRate, $branchFloor)
            exit 1
          }

      - name: Upload test results
        # Always: the trx of a crashed/hung run carries the last-running-test
        # and per-test timings for post-mortems.
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  docs-links:
    name: docs-links (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json
            dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build DocFX metadata
        run: dotnet docfx metadata docs/docfx/docfx.json

      - name: Stage Docsify site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          rm -rf _site/docfx _site/api

      - name: Build DocFX API reference
        run: dotnet docfx build docs/docfx/docfx.json --output _site/api

      - name: Check local documentation links
        run: python3 scripts/check_docs_links.py _site

  packaging-smoke:
    name: packaging-smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y fish groff mandoc shellcheck zsh

      - name: Validate shell completions
        run: |
          set -euo pipefail
          bash -n docs/completions/xisosharp.bash
          zsh -n docs/completions/_xisosharp
          fish -n docs/completions/xisosharp.fish
          shellcheck docs/completions/xisosharp.bash
          python3 scripts/check_cli_completions.py

      - name: Parse PowerShell completion
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "docs/completions/xisosharp.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell completion parses cleanly."

      - name: Render man page
        run: |
          set -euo pipefail
          groff -man -Tutf8 -ww -z docs/man/xisosharp.1
          mandoc -T lint -W error docs/man/xisosharp.1
          # Plain grep (no -q) drains the pipe; grep -q closes it early and
          # grotty reports a spurious "output error" on SIGPIPE.
          groff -man -Tutf8 docs/man/xisosharp.1 | grep -F 'XISOSHARP' > /dev/null
          echo "man page renders."

  packaging-windows:
    name: packaging-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate winget manifest
        shell: pwsh
        run: |
          $root = 'packaging/winget/manifests/p/purelogiccode/XISOSharp'
          $version = Get-ChildItem $root -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $version) { throw 'No winget manifest version directory found.' }
          winget validate --manifest $version.FullName
          if ($LASTEXITCODE -ne 0) { throw "winget validate exited $LASTEXITCODE" }

      - name: Validate Scoop manifest
        shell: pwsh
        run: |
          $root = 'packaging/winget/manifests/p/purelogiccode/XISOSharp'
          $version = Get-ChildItem $root -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $scoop = Get-Content 'packaging/scoop/xisosharp.json' -Raw | ConvertFrom-Json
          if ($scoop.version -ne $version.Name) {
            throw "Scoop is $($scoop.version) but winget is $($version.Name)"
          }
          foreach ($architecture in $scoop.architecture.PSObject.Properties) {
            if ($architecture.Value.hash -notmatch '^[0-9a-f]{64}$') {
              throw "Invalid SHA-256 for $($architecture.Name)"
            }
          }
          Write-Host "Scoop manifest matches winget $($version.Name)."

  package-install-smoke:
    name: package-install (${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: windows
            os: windows-latest
          - kind: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Install from winget and Scoop
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- winget: local manifest install -------------------------------
          winget settings --enable LocalManifestFiles
          $root = 'packaging/winget/manifests/p/purelogiccode/XISOSharp'
          $version = Get-ChildItem $root -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          winget install --manifest $version.FullName `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install exited $LASTEXITCODE" }

          $links = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          $banner = & (Join-Path $links 'xisosharp.exe') -v
          if ($LASTEXITCODE -ne 0) { throw "winget-installed CLI exited $LASTEXITCODE" }
          $text = $banner -join "`n"
          if ($text -notmatch '^XISOSharp v\d+\.\d+\.\d+') { throw "Unexpected winget banner: $text" }
          Write-Host $text
          winget uninstall --id purelogiccode.XISOSharp --exact `
            --disable-interactivity --accept-source-agreements
          # The portable package is not always registered under the manifest ID;
          # cleanup is best-effort on the ephemeral runner.
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "winget uninstall exited $LASTEXITCODE (cleanup only)."
          }

          # --- Scoop: repository-root bucket --------------------------------
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop'
          $env:SCOOP_GLOBAL = Join-Path $env:RUNNER_TEMP 'scoop-global'
          $installer = [scriptblock]::Create((Invoke-RestMethod -Uri 'https://get.scoop.sh'))
          $isAdmin = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($isAdmin) { & $installer -RunAsAdmin } else { & $installer }
          if ($LASTEXITCODE -ne 0) { throw "Scoop install script exited $LASTEXITCODE" }
          $env:PATH = "$(Join-Path $env:SCOOP 'shims');$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { throw 'scoop was not found after installation.' }
          scoop bucket add xisosharp $env:GITHUB_WORKSPACE
          scoop install xisosharp/xisosharp
          if ($LASTEXITCODE -ne 0) { throw "scoop install exited $LASTEXITCODE" }
          $shim = Join-Path $env:SCOOP 'shims\xisosharp.exe'
          $scoopBanner = & $shim -v
          if ($LASTEXITCODE -ne 0) { throw "Scoop-installed CLI exited $LASTEXITCODE" }
          $scoopText = $scoopBanner -join "`n"
          if ($scoopText -notmatch '^XISOSharp v\d+\.\d+\.\d+') { throw "Unexpected Scoop banner: $scoopText" }
          Write-Host $scoopText
          scoop uninstall xisosharp

      - name: Validate cask syntax
        if: matrix.kind == 'macos'
        run: ruby -c packaging/homebrew/xisosharp.rb

      - name: Install from Homebrew
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew rejects cask files outside a tap; create a throwaway tap
          # and install the checked-in cask through it.
          tap="xisosharp/test"
          brew tap-new --no-git "$tap"
          tap_dir="$(brew --repository "$tap")"
          mkdir -p "$tap_dir/Casks"
          cp packaging/homebrew/xisosharp.rb "$tap_dir/Casks/xisosharp.rb"
          brew install --cask --skip-cask-deps "$tap/xisosharp"
          banner="$(xisosharp -v)"
          echo "$banner"
          grep -Eq '^XISOSharp v[0-9]+\.[0-9]+\.[0-9]+' <<< "$banner"
          brew uninstall --cask "$tap/xisosharp"

  aot-smoke:
    name: aot-smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish and run AOT smoke
        run: |
          dotnet publish XISOSharp.AotSmoke/XISOSharp.AotSmoke.csproj -c Release -r linux-x64 -o aot
          ./aot/XISOSharp.AotSmoke

  fuzz-smoke:
    name: fuzz-smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Mutation fuzz (2 minutes)
        run: >-
          dotnet run --project XISOSharp.Fuzz/XISOSharp.Fuzz.csproj
          -c Release -- --seconds 120 --seed 20261101

  battle-interop:
    name: battle-interop (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Build battle harness
        run: dotnet build XISOSharp.BattleTests/XISOSharp.BattleTests.csproj -c Release -m:1

      - name: Synthetic corpus interop
        # Copyright-free corpus generated by the CLI itself; the checked-in
        # reference binaries (extract-xiso, xdvdfs, xboxkit) are the oracles.
        # ZAR/petrify are excluded here because xboxkit refuses/mis-decodes the
        # synthetic edge cases (empty dirs, Latin-1 names); the real-ISO harness
        # still covers those ops locally.
        run: >-
          dotnet run --project XISOSharp.BattleTests/XISOSharp.BattleTests.csproj
          -c Release --no-build --
          --synthetic --count 5 --seed 20261101
          --ops list,extract,rewrite,checksum,md5,unpack,pack,cso
          --timeout 20

      - name: Upload battle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: battle-reports
          path: |
            BattleReports/**/*.txt
            BattleReports/**/*.json
          if-no-files-found: warn

  gui-smoke:
    name: gui-smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Build CLI and GUI
        # -m:1: the GUI build stages the CLI beside itself out-of-band.
        run: |
          dotnet build XISOSharp.Cli/XISOSharp.Cli.csproj -c Release -f net10.0 -m:1
          dotnet build XISOSharp.Gui/XISOSharp.Gui.csproj -c Release -m:1

      - name: Headless GUI contract
        # Verifies the documented smoke contract (AGENTS.md): CLI -v banner,
        # GUI --probe-cli, GUI --self-test. The GUI is a WinExe, so PowerShell
        # does not wait for `&`; Start-Process -Wait captures output and exit code.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cli = (Resolve-Path 'XISOSharp.Cli/bin/Release/net10.0/XISOSharp.exe').Path
          $gui = (Resolve-Path 'XISOSharp.Gui/bin/Release/net10.0/XISOSharp.Gui.exe').Path

          $bannerLines = & $cli -v
          if ($LASTEXITCODE -ne 0) { throw "CLI -v exited $LASTEXITCODE" }
          $banner = $bannerLines -join "`n"
          if ($banner -notmatch '^XISOSharp v\d+\.\d+\.\d+') { throw "Unexpected CLI banner: $banner" }
          Write-Host $banner

          function Invoke-Gui([string[]]$Arguments) {
            $stdout = Join-Path $env:RUNNER_TEMP ("gui-out-" + [guid]::NewGuid().ToString('N') + ".txt")
            $stderr = Join-Path $env:RUNNER_TEMP ("gui-err-" + [guid]::NewGuid().ToString('N') + ".txt")
            $process = Start-Process -FilePath $gui -ArgumentList $Arguments -Wait -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text = (Get-Content -LiteralPath $stdout -Raw) + (Get-Content -LiteralPath $stderr -Raw)
            if ($process.ExitCode -ne 0) {
              Write-Host $text
              throw "GUI $($Arguments -join ' ') exited $($process.ExitCode)"
            }
            return $text
          }

          $probe = Invoke-Gui @('--probe-cli', $cli)
          Write-Host $probe
          # The label comes from file metadata; single-file Linux/macOS builds
          # fall back to the documented "XISOSharp CLI" form.
          if ($probe -notmatch 'XISOSharp (\d+\.\d+\.\d+|CLI)') { throw 'GUI --probe-cli did not print the product label.' }

          $selfTest = Invoke-Gui @('--self-test', $cli)
          Write-Host $selfTest
          if ($selfTest -notmatch 'SELF-TEST: all passed') { throw 'GUI --self-test did not pass.' }

  inspectcode:
    name: inspectcode (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Upload the SARIF report to the Security > Code scanning tab.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Install InspectCode
        # Pinned: the tool's rule set changes between releases, so a floating
        # version would turn unrelated PRs red. Bump deliberately.
        shell: pwsh
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools --version 2026.2.3.1
          # setup-dotnet does not add the global-tool shim directory to PATH.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build solution
        run: dotnet build CSharp_XISOSharp.sln -c Release -m:1

      - name: Inspect
        shell: pwsh
        run: |
          jb inspectcode CSharp_XISOSharp.sln --output=inspectcode.sarif --format=Sarif `
            --severity=WARNING --no-build --no-updates --verbosity=WARN
          if (-not (Test-Path inspectcode.sarif)) { throw 'InspectCode did not produce a SARIF report.' }

          $sarif = Get-Content inspectcode.sarif -Raw | ConvertFrom-Json
          $results = @($sarif.runs | ForEach-Object { $_.results } | Where-Object { $_ })
          if ($results.Count -eq 0) {
            Write-Host 'InspectCode: 0 warnings, 0 errors.'
            exit 0
          }

          $results | Select-Object -First 50 | ForEach-Object {
            $location = $_.locations[0].physicalLocation
            Write-Host ("{0}:{1}: {2} [{3}]" -f $location.artifactLocation.uri, $location.region.startLine,
              $_.message.text, $_.ruleId)
          }
          throw "InspectCode reported $($results.Count) warning(s)/error(s)."

      - name: Upload SARIF
        # Fork PRs get a read-only token, so the upload is skipped there.
        if: >-
          always() && hashFiles('inspectcode.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: inspectcode.sarif
          category: inspectcode

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore

      - name: Fail on vulnerable NuGet packages
        # NuGet audit already surfaces advisories during restore; this gate makes
        # a known-vulnerable direct or transitive package fail the build.
        run: |
          dotnet list CSharp_XISOSharp.sln package --vulnerable --include-transitive --no-restore | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected (see the step log)."
            exit 1
          fi

      - name: Deprecated packages (informational)
        continue-on-error: true
        run: dotnet list CSharp_XISOSharp.sln package --deprecated --no-restore

  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Package only when every gate is green: a tag push then publishes exactly
    # what CI validated.
    needs: [build-and-test, gui-smoke, inspectcode, dependency-audit, aot-smoke, fuzz-smoke, battle-interop, packaging-smoke, packaging-windows]
    env:
      # Optional NuGet author signing. Both secrets are required together; when
      # they are absent the step is skipped and the packages stay unsigned.
      NUGET_SIGNING_CERT: ${{ secrets.NUGET_SIGNING_CERT }}
      NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
      NUGET_SIGNING_TIMESTAMPER: ${{ vars.NUGET_SIGNING_TIMESTAMPER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore XISOSharp/XISOSharp.csproj

      - name: Build library
        run: dotnet build XISOSharp/XISOSharp.csproj --no-restore --configuration Release

      - name: Pack
        # The library is the only packable project (it also carries strict
        # package validation); .snupkg holds its symbols. The CLI ships as
        # GitHub release bundles only.
        run: dotnet pack XISOSharp/XISOSharp.csproj --no-build --configuration Release --output artifacts

      - name: Sign packages (optional)
        # DST-01: NuGet author signing. Enable by adding the `NUGET_SIGNING_CERT`
        # (base64 PFX) and `NUGET_SIGNING_PASSWORD` repository secrets; the
        # unsigned path remains the default.
        if: env.NUGET_SIGNING_CERT != ''
        shell: bash
        run: |
          set -euo pipefail
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$NUGET_SIGNING_CERT" | base64 --decode > "$cert"
          timestamper="${NUGET_SIGNING_TIMESTAMPER:-https://timestamp.digicert.com}"
          for package in artifacts/*.nupkg artifacts/*.snupkg; do
            dotnet nuget sign "$package" \
              --certificate-path "$cert" \
              --certificate-password "$NUGET_SIGNING_PASSWORD" \
              --timestamper "$timestamper" \
              --overwrite
            dotnet nuget verify "$package" --all
          done
          echo "Signed and verified $(find artifacts -maxdepth 1 \( -name '*.nupkg' -o -name '*.snupkg' \) | wc -l) package(s)."

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish-nuget:
    name: publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pack
    # Tag pushes only; branch/PR runs stop at pack.
    if: startsWith(github.ref, 'refs/tags/')
    environment: nuget
    steps:
      # checkout supplies global.json for setup-dotnet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # --skip-duplicate makes re-runs safe (e.g. a manual push already landed).
      - name: Push package
        run: >-
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols
        run: >-
          dotnet nuget push ./artifacts/*.snupkg
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
